<!DOCTYPE html>
<html>
<head>
    <title>Iframe Example</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
        }

        .header{
            background:#1E90FF;
            color:white;
            text-align:center;
            padding:20px;
        }

        .container{
            display:flex;
            height:90vh;
        }

        .menu{
            width:25%;
            background:#f2f2f2;
            padding:20px;
        }

        .menu a{
            display:block;
            text-decoration:none;
            background:#87CEEB;
            color:black;
            padding:12px;
            margin-bottom:10px;
            border-radius:5px;
        }

        .menu a:hover{
            background:#1E90FF;
            color:white;
        }

        iframe{
            width:75%;
            height:100%;
            border:none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>COLLEGE WEBSITE</h1>
</div>

<div class="container">

    <div class="menu">
        <a href="home.html" target="content">Home</a>
        <a href="about.html" target="content">About</a>
        <a href="contact.html" target="content">Contact</a>
    </div>

    <iframe src="home.html" name="content"></iframe>

</div>

</body>
</html>
